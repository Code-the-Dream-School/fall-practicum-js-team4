openapi: 3.0.3
info:
  title: Lost & Found Pets API
  version: 1.0.0
  description: |
    Authentication uses an httpOnly cookie named `token`. Register or login
    sets it; the browser (or Postman) then sends it automatically.
    Full contract: docs/auth.md in the repository.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Sign up, sign in, sign out and the current user
  - name: Reports
    description: Create and manage pet reports

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Create an account with email and password, and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Sam Rivera
              email: sam@example.com
              password: correct-horse-1
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: EMAIL_TAKEN
                message: An account with this email already exists
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: sam@example.com
              password: correct-horse-1
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Wrong password or unknown email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Email or password is incorrect
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/password:
    patch:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password (signs out other devices)
      description: |
        Requires a signed-in user. On success the cookie is replaced: this session stays signed in, every other session gets 401.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: correct-horse-1
              newPassword: even-better-horse-2
      responses:
        "200":
          description: Password changed; a new session cookie is set
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: |
            VALIDATION_ERROR (missing/invalid fields, or new password same as current)
            or INVALID_CURRENT_PASSWORD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongCurrentPassword:
                  summary: Wrong current password
                  value:
                    success: false
                    code: INVALID_CURRENT_PASSWORD
                    message: Current password is incorrect
                samePassword:
                  summary: New password equals the current one
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: Invalid request data
                    details:
                      - field: newPassword
                        message: New password must be different from the current password
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Sign out (clears the cookie)
      description: Always succeeds, even if no one is signed in.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    nullable: true
                    example: null

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the signed-in user
      description: Call on app load. 200 means signed in, 401 means signed out.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: Create a new pet report
      description: >-
        Creates a lost or found pet report owned by the signed-in user. The owner,
        status, id and timestamps are always set by the server; sending them is a
        400. A user can have at most 100 reports. Text is stored exactly as sent, so
        clients must render it as text (never as HTML).


        **With photos:** send `multipart/form-data` with the report as JSON text in a
        `report` field and up to 5 `photos` files (JPEG, PNG or WebP, 5 MB each). The
        server removes all metadata (including GPS location), applies the phone's
        rotation, resizes to at most 1600 px, converts to WebP and stores the images on
        Cloudinary. Without photos, plain JSON works as before.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [report]
              properties:
                report:
                  type: string
                  description: The report as JSON text (same fields as the JSON body)
                  example: '{"reportType":"LOST","petType":"DOG","petName":"Milo","color":"Golden","size":"LARGE","gender":"MALE","eventDate":"2026-10-20T10:00:00.000Z"}'
                photos:
                  type: array
                  maxItems: 5
                  description: Up to 5 JPEG, PNG or WebP images, 5 MB each
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Report created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReportResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The user already has the maximum number of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: REPORT_LIMIT_REACHED
                message: You can have at most 100 reports.
        "502":
          description: >-
            The photo storage service failed. Nothing is saved, and any photos already
            uploaded for this request are deleted; the client can retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                code: PHOTO_UPLOAD_FAILED
                message: Could not upload photos. Please try again.

  /api/reports/mine:
    get:
      tags: [Reports]
      operationId: getMyReports
      summary: List the signed-in user's reports
      description: >-
        Returns every report the signed-in user created, newest first, with location.
        Not paginated. Optionally filtered by `search`. Owner-only: includes
        contact info and exact coordinates. Sent with `Cache-Control: private, no-store`.
      security:
        - cookieAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive partial match on pet name, breed, color, distinctive
            features or city. Surrounding spaces are ignored; empty returns everything.
          schema:
            type: string
            maxLength: 100
          example: golden
      responses:
        "200":
          description: The user's reports (an empty array when there are none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReportsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  headers:
    SessionCookie:
      description: >-
        Session cookie (HttpOnly, SameSite=Lax). 7 days, or until the browser closes
        when signing in with rememberMe false
      schema:
        type: string
        example: token=eyJhbGciOiJIUzI1NiIs...; Max-Age=604800; Path=/; HttpOnly; SameSite=Lax

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lowercase
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
        rememberMe:
          type: boolean
          default: true
          description: >-
            true keeps the session cookie for 7 days; false makes it a browser-session
            cookie (no Max-Age) that is deleted when the browser closes

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 6f1c2b9e-1d2a-4c6e-9a51-3d8f0e2b7a10
        email:
          type: string
          format: email
          example: sam@example.com
        name:
          type: string
          example: Sam Rivera
        createdAt:
          type: string
          format: date-time
          example: "2026-10-16T19:40:00.000Z"

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/User"

    CreateReportRequest:
      type: object
      required: [reportType, petType, color, size, gender, eventDate]
      properties:
        reportType:
          type: string
          enum: [LOST, FOUND]
        petType:
          type: string
          enum: [DOG, CAT, BIRD, OTHER]
        petName:
          type: string
          maxLength: 100
          nullable: true
        breed:
          type: string
          maxLength: 100
          nullable: true
        color:
          type: string
          maxLength: 100
        size:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
        gender:
          type: string
          enum: [MALE, FEMALE, UNKNOWN]
        distinctiveFeatures:
          type: string
          maxLength: 1000
          nullable: true
        eventDate:
          type: string
          format: date
          example: "2026-10-22"
        contactInfo:
          type: string
          maxLength: 255
          nullable: true
        location:
          type: object
          required: [zipCode, city, state]
          properties:
            zipCode:
              type: string
              pattern: '^\d{5}$'
            city:
              type: string
              maxLength: 100
            state:
              type: string
              minLength: 2
              maxLength: 2
        # Photos aren't part of the JSON body: upload them as files with
        # multipart/form-data (see the request body of POST /api/reports)

    CreateReportResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Report"

    MyReportsResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [total, reports]
          properties:
            total:
              type: integer
              description: Number of reports returned (with `search`, the number of matches)
              example: 3
            reports:
              type: array
              items:
                $ref: "#/components/schemas/Report"

    Report:
      type: object
      required:
        [
          petReportId,
          userId,
          reportType,
          petType,
          color,
          size,
          gender,
          eventDate,
          status,
          createdAt,
          photos,
        ]
      properties:
        petReportId:
          type: integer
        userId:
          type: string
          format: uuid
        reportType:
          type: string
          enum: [LOST, FOUND]
        petType:
          type: string
          enum: [DOG, CAT, BIRD, OTHER]
        petName:
          type: string
          nullable: true
        breed:
          type: string
          nullable: true
        color:
          type: string
        size:
          type: string
        gender:
          type: string
        distinctiveFeatures:
          type: string
          nullable: true
        eventDate:
          type: string
          format: date-time
        contactInfo:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, REUNITED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        location:
          type: object
          nullable: true
          properties:
            locationId:
              type: integer
            petReportId:
              type: integer
            zipCode:
              type: string
              example: "10001"
            city:
              type: string
              example: "New York"
            state:
              type: string
              example: "NY"
            latitude:
              type: string
              nullable: true
              example: "40.7128000"
            longitude:
              type: string
              nullable: true
              example: "-74.0060000"
        photos:
          type: array
          description: In upload order; an empty array when the report has none
          items:
            type: object
            required: [petPhotoId, imageUrl, createdAt]
            properties:
              petPhotoId:
                type: integer
              imageUrl:
                type: string
                format: uri
                example: "https://res.cloudinary.com/demo/image/upload/v1/pawradar/reports/abc123.webp"
              createdAt:
                type: string
                format: date-time

    Error:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_CURRENT_PASSWORD
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - EMAIL_TAKEN
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - TOO_MANY_REQUESTS
            - REPORT_LIMIT_REACHED
            - PHOTO_UPLOAD_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          description: Only present on VALIDATION_ERROR
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    ValidationError:
      description: Missing or invalid fields, unknown fields, or invalid JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            code: VALIDATION_ERROR
            message: Invalid request data
            details:
              - field: email
                message: '"email" must be a valid email'
    Unauthenticated:
      description: No valid session cookie
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            code: UNAUTHENTICATED
            message: Please sign in
    TooManyRequests:
      description: Rate limit hit (20 auth attempts per IP per 15 minutes)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            code: TOO_MANY_REQUESTS
            message: Too many attempts, please try again later
